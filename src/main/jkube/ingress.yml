apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medgym-ingress
  annotations:
    ingress.kubernetes.io/rewrite-target: /medgym
spec:
  rules:
    - http:
        paths:
          - path: /medgym
            pathType: Prefix
            backend:
              service:
                name: medgym
                port:
                  number: 8080
