stages:
  - build
  - sonar

build-backend:
  stage: build
  tags:
    - sonar
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn -f pom.xml -DskipTests -Dskip.yarn=true -Dskip.npm=true -Dskip.frontend=true clean compile
  artifacts:
    paths:
      - target
    expire_in: 1h
  only:
    - test/manual-analysis

sonarqube-check:
  stage: sonar
  tags:
    - sonar
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  script:
    - sonar-scanner
      -Dsonar.projectKey=es.udc.fi.dc.fd:medgym
      -Dsonar.sources=src/main/java,frontend/src
      -Dsonar.java.binaries=target/classes
      -Dsonar.host.url=https://sonar.fic.udc.es
      -Dsonar.login=$SONAR_TOKEN
      -Dsonar.branch.name=test/manual-analysis
  dependencies:
    - build-backend
  only:
    - test/manual-analysis
